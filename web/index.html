<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DayFi is your global wallet for Africa. Send money across borders, pay airtime and bills, hold USD and NGN, set personal budgets, and earn daily interest with Daily Earn.">
  <meta name="theme-color" content="#090909">
  <meta name="color-scheme" content="dark light">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DayFi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32"/>
  <link rel="icon" type="image/png" href="icons/Icon-192.png" sizes="192x192"/>
  <link rel="shortcut icon" href="favicon.png"/>

  <title>DayFi — Send Money, Pay Bills & Save Across Africa</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #090909;
    }

    #dayfi-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #090909;
      z-index: 2147483647;
      transition: opacity 0.18s ease;
    }

    #dayfi-boot.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #dayfi-boot img {
      width: 72px;
      height: 72px;
      display: block;
      animation: dayfi-boot-pulse 2.4s ease-in-out infinite;
    }

    @keyframes dayfi-boot-pulse {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.96);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="dayfi-boot" aria-hidden="true">
    <img src="logo_splash.png" alt="DayFi" width="72" height="72" decoding="async" />
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      function removeDayfiBoot() {
        var el = document.getElementById("dayfi-boot");
        if (!el || el.dataset.removed === "1") return;
        el.dataset.removed = "1";
        el.classList.add("fade-out");
        window.setTimeout(function () {
          el.remove();
        }, 200);
      }

      window.addEventListener("flutter-first-frame", removeDayfiBoot);
      window.setTimeout(removeDayfiBoot, 15000);
    })();
  </script>
</body>
</html>
